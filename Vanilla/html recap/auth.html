<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Resale Tracker: Inventory management system</title>
    </head>
    <body>
        <header>
            <img src="../rt-logo-test.PNG">
            <h1>Resale Tracker</h1>            
        </header>
        <hr>
        <main>
            <h2>Welcome!</h2>
            <hr>
            <section>
                <h3>Resale Tracker</h3>
                <button type="submit">Login</button>
                <button type="submit">Sign Up</button>
            </section>
            <hr>
            <section>
                <form>
                    <fieldset>
                        <legend>Login</legend>
                        <label>Email</label>
                        <input type="text"> <br>
                        <label>Password</label>
                        <input type="text" required> <br>
                    </fieldset>
                    <button type="submit">Login</button>
                </form>
                <p>Don't have an account?<a href="...">Sign Up</a></p>
                <hr>
                <form>
                    <fieldset>
                        <legend>Sign Up</legend>
                        <label>Full Name</label>
                        <input type="text"> <br>
                        <label>Email</label>
                        <input type="text" required> <br>
                        <label>Username</label>
                        <input type="text"> <br>
                        <label>Password</label>
                        <input type="text" required> <br>
                        <label>Confirm Password</label>
                        <input type="text" required> <br>
                    </fieldset>  
                    <button type="submit">Create account</button>
                </form>
                <p>Already have an account? <a href="...">Login</a></p>
            </section>
        </main>
        <hr>
        <footer>
            © Copyright 2026
        </footer>
    </body>
</html>
