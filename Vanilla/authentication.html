<!DOCTYPE html>
<html>
    <head>
        <title>Flinventraq</title>
        <meta charset="YTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Flinventraq: Inventory Management System for Resellers">
    </head>
    <body>
        <!-- Some Semantic elements -->
         <header>
            <img src="letter-F.png" alt="Oop! logo not found..." width="50" height="50">
            <h1>Flinventraq</h1>
         </header>
         <hr>
         <main>
            <h2>Welcome!</h2>
            <hr>
            <!-- Log-In Card-->
            <section>
                <h3>Flinventraq</h3>
                <h4>Log-In</h4>
                <!-- Insert Form here-->
                 <form>
                    <input type="button" value="Log-In">
                    <input type="button" value="Sign-Up">
                    <hr>
                    <span>
                        <p>Email</p>
                        <input type="text" name="email" placeholder="Enter your email" required>
                    </span>
                    <span>
                        <p>Password</p>
                        <input type="password" name="password" placeholder="Enter your password" required>
                    </span>
                    <hr>
                    <input type="submit" value="Log-In">
                    <p>Don't have an account? <a href="">Sign-Up</a></p> <!-- "Sign-Up" this should be a hyperlink to sign-up page. Add page link in href-->
                 </form>
            </section>
            <hr>
            <!-- Sign-Up Card-->
            <section>
                <h3>Flinventraq</h3>
                <h4>Sign-Up</h4>
                <!-- Insert Form here-->
                 <form>
                    <input type="button" value="Log-In">
                    <input type="button" value="Sign-Up">
                    <hr>
                    <span>
                        <p>Full Name</p>
                        <input type="text" name="fullname">
                    </span>
                    <span>
                        <p>Email</p>
                        <input type="text" name="email" required>
                    </span>
                    <span>
                        <p>Username</p>
                        <input type="text" name="username">
                    </span>
                    <span>
                        <p>Password</p>
                        <input type="password" name="password" required>
                    </span>
                    <span>
                        <p>Confirm Password</p>
                        <input type="password" name="cpassword" required>
                    </span>
                    <hr>
                    <input type="submit" value="Create Account">
                    <p>Already have an account? <a href="">Log-In</a></p> <!-- "Log-In" this should be a hyperlink to log-in page. Add page link in href-->
                 </form>
            </section>
         </main>
         <hr>
         <footer>© Copyright 2026</footer> <!--Short cut for the copywrit symbol on Mac = OPtions+G-->
    </body>
</html>
