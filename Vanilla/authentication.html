<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Resale Tracker</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Resale Tracker: Inventory Management System for Resellers">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header class="app-header">
            <img class="app-logo" src="rt-logo-test.PNG" alt="Resale Tracker logo" width="50" height="50">
            <h1 class="app-title">Resale Tracker</h1>
        </header>
        <hr>
        <main class="auth-page">
            <!-- Log-In & Sign-up Cards-->
            <section class="auth-section">
                <header class="auth-header">
                    <h2>Resale Tracker Inventory Managemen System</h2>
                </header>
                <!-- 0. Login / Signup Switch -->
                <div class="auth-switch">
                    <button class="auth-switch-login" type="button">Login</button>
                    <button class="auth-switch-signup" type="button">Sign Up</button>
                </div>
                <hr>
                <!-- 1. Login Card-->
                <form class="auth-card login-card" action="user-log-in" method="post">
                    <fieldset>
                        <legend>Login</legend>
                        <!--Login fields-->
                        <label class="form-label" for="email">Email</label>
                        <input class="form-input" type="text" id="email" name="email" placeholder="Enter your email" required>
                        <label class="form-label" for="password">Password</label>
                        <input class="form-input" type="password" id="password" name="password" placeholder="Enter your password" required>
                    </fieldset>
                    <button type="submit">Login</button>
                    <p>Don't have an account? 
                        <a href="">Sign Up</a>
                    </p> <!-- "Sign-Up" this should be a hyperlink to sign-up page. Add page link in href-->
                </form>
                <hr> 
                <!-- 2. Sign-Up Card -->
                <form class="auth-card signup-card" action="user-sign-up" method="post">
                    <fieldset>
                        <legend>Sign Up</legend>
                        <!--Signup fields-->
                        <label class="form-label" for="name">Full Name</label>
                        <input class="form-input" type="text" name="name">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-input" type="text" id="email" name="email" required>
                        <label class="form-label" for="username">Username</label>
                        <input class="form-input" type="text" id="name" name="username">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-input" type="password" id="password" name="password" required>
                        <label class="form-label" for="confirm-password">Confirm Password</label>
                        <input class="form-input" type="password" id="confirm-password" name="confirm-password" required>
                    </fieldset>
                    <button type="submit">Create account</button>
                    <p>Already have an account? 
                        <a href="">Login</a>
                    </p> <!-- "Log-In" this should be a hyperlink to log-in page. Add page link in href-->
                </form>
            </section>
        </main>
        <hr>
        <footer class="app-footer">© Copyright 2026</footer> <!--Short cut for the copywrit symbol on Mac = OPtions+G-->
    </body>
</html>
