<!DOCTYPE html>
<html>
    <head>
        <title>Resale Tracker</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Resale Tracker: Inventory Management System for Resellers">
    </head>
    <body>
        <!-- Some Semantic elements -->
         <header>
            <img src="rt-logo-test.PNG" alt="Oop! logo not found..." width="50" height="50">
            <h1>Resale Tracker</h1>
         </header>
         <hr>
         <main>
            <h2>Welcome!</h2>
            <hr>
            <!-- Log-In Card-->
            <section>
                <h3>Resale Tracker</h3>
                <h4>Log-In</h4>
                <!-- Insert Form here-->
                 <form action="user-log-in" method="post">
                    <button type="submit">Log-In</button>
                    <button type="submit">Sign-Up</button>
                    <hr>
                    <fieldset>
                        <label for="email">Email</label>
                        <input type="text" id="email" name="email" placeholder="Enter your email" required>
                    </fieldset>
                    <fieldset>
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </fieldset>
                    <button type="submit">Log-In</button>
                    <p>Don't have an account? <a href="">Sign-Up</a></p> <!-- "Sign-Up" this should be a hyperlink to sign-up page. Add page link in href-->
                 </form>
            </section>
            <hr>
            <!-- Sign-Up Card-->
            <section>
                <h3>Resale Tracker</h3>
                <h4>Sign-Up</h4>
                <!-- Insert Form here-->
                 <form action="user-sign-up" method="post">
                    <button type="submit">Log-In</button>
                    <button type="submit">Sign-Up</button>
                    <hr>
                    <fieldset>
                        <label for="name">Full Name</label>
                        <input type="text" name="name">
                    </fieldset>
                    <fieldset>
                        <label for="email">Email</label>
                        <input type="text" id="email" name="email" required>
                    </fieldset>
                    <fieldset>
                        <label for="username">Username</label>
                        <input type="text" id="name" name="username">
                    </fieldset>
                    <fieldset>
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </fieldset>
                    <fieldset>
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                    </fieldset>
                    <button type="submit">Sign-Up</button>
                    <p>Already have an account? <a href="">Log-In</a></p> <!-- "Log-In" this should be a hyperlink to log-in page. Add page link in href-->
                 </form>
            </section>
         </main>
         <hr>
         <footer>© Copyright 2026</footer> <!--Short cut for the copywrit symbol on Mac = OPtions+G-->
    </body>
</html>
